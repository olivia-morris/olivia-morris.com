  <style>
    .contact-section {
      padding: 80px 0 100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;
    }
    .contact-left h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 300;
      line-height: 1.1;
      color: var(--black);
      margin-bottom: 16px;
    }
    .contact-left p {
      font-size: 15px;
      color: var(--gray);
      line-height: 1.7;
      margin-bottom: 40px;
    }
    .contact-details {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 40px;
    }
    .contact-detail {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }
    .contact-detail:hover {
      color: var(--black);
    }
    .contact-detail svg {
      width: 16px; height: 16px;
      fill: var(--gray);
      flex-shrink: 0;
    }
    .form-embed {
      width: 100%;
    }
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 520px;
    }
    .contact-form label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--gray);
    }
    .contact-form input,
    .contact-form textarea {
      font-family: 'Jost', sans-serif;
      font-size: 16px;
      color: var(--text);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--light-gray);
      padding: 10px 0;
      border-radius: 0;
      resize: vertical;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      border-bottom-color: var(--black);
    }
    .contact-form button {
      align-self: flex-start;
      font-family: 'Jost', sans-serif;
      font-size: 14px;
      letter-spacing: 0.04em;
      color: var(--white);
      background: var(--black);
      border: 1px solid var(--black);
      padding: 14px 28px;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .contact-form button:hover,
    .contact-form button:focus-visible {
      background: transparent;
      color: var(--black);
    }
    @media (max-width: 680px) {
      .contact-section {
        grid-template-columns: 1fr;
        gap: 48px;
        padding: 60px 0 80px;
      }
      .contact-left h2 { font-size: 36px; }
    }
    .footer-privacy {
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--gray);
      text-decoration: none;
      margin-left: 8px;
    }
    .footer-privacy:hover { color: var(--black); }
  </style>
